spring:
  application:
    name: facade-pattern-demo

  datasource:
    url: jdbc:postgresql://localhost:5432/condoconnect
    driver-class-name: org.postgresql.Driver
    username: admin
    password: admin123

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  cache:
    type: simple

server:
  port: 8080

# Application Configuration
condoconnect:
  reports:
    cache-expiration: 24h
    pdf-template: financial-report-v3
    enable-email-notifications: true
    max-retries: 3
  email:
    smtp-host: smtp.condoconnect.com
    smtp-port: 587
    use-tls: true
    from-address: noreply@condoconnect.com

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  simple:
    metrics:
      export:
        enabled: true

logging:
  level:
    com.condoconnect.facade: DEBUG
    org.hibernate.SQL: DEBUG