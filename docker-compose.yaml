version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: facade-pattern-postgres
    environment:
      POSTGRES_DB: condoconnect
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d condoconnect" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  data: